name: Build QazaNamaz APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o QazaNamazAndroid.zip -d extracted
          cp -R extracted/. .
          rm -rf extracted
                - name: Fix Java and Kotlin targets
        run: |
          sed -i '/^android {/a\    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\n    kotlinOptions { jvmTarget = "17" }' app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: QazaNamaz-APK
          path: app/build/outputs/apk/debug/app-debug.apk
